spring:
  application:
    name: runnit-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}/${DB_NAME:runnit_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

aws:
  s3:
    bucket-name: ${S3_BUCKET_NAME:runnit-uploads}
    region: ${AWS_REGION:us-west-2}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}

server:
  port: 8080

logging:
  level:
    com.runnit.api: ${RUNNIT_LOG_LEVEL:INFO}

